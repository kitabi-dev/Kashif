name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17' }
      - name: Install Android SDK
        run: |
          mkdir -p $HOME/android-sdk/cmdline-tools
          curl -L -o cmdline.zip "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          unzip -q cmdline.zip -d $HOME/android-sdk/cmdline-tools
          mv $HOME/android-sdk/cmdline-tools/cmdline-tools $HOME/android-sdk/cmdline-tools/latest
          yes | $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-33" "build-tools;33.0.2"
      - name: Download android.jar
        run: |
          mkdir -p lib
          curl -L -o android.jar.zip "https://dl.google.com/android/repository/platform-33_r02.zip"
          unzip -o android.jar.zip "android-13/android.jar" -d lib/
          mv lib/android-13/android.jar lib/android.jar
          rm -rf android.jar.zip lib/android-13
      - name: Generate debug keystore
        run: |
          keytool -genkey -v -keystore debug.keystore -alias debug \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android -dname "CN=Debug"
      - name: Download json.jar
        run: |
          curl -L -o lib/json.jar "https://repo1.maven.org/maven2/org/json/json/20231013/json-20231013.jar"
      - name: Create 15MB dummy asset
        run: |
          mkdir -p assets
          dd if=/dev/urandom of=assets/dummy.bin bs=1M count=15
      - name: Build
        run: |
          export ANDROID_HOME=$HOME/android-sdk
          export PATH=$PATH:$ANDROID_HOME/build-tools/33.0.2
          bash build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: kashif-apk
          path: build/app.apk
